<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <rect width="1000" height="700" fill="#f8f9fa" stroke="#333" stroke-width="2"/>
  <text x="500" y="35" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a252f">CentriFlow Pro 5000 - Electrical Wiring & Control Schematic</text>
  <text x="500" y="55" font-family="Arial" font-size="12" text-anchor="middle" fill="#555">Document ID: DWG-ELEC-2024-CF5K | Sheet 1 of 1 | Rev 2.1</text>

  <!-- Main 460V Power Lines -->
  <g stroke="#000" stroke-width="3">
    <line x1="100" y1="100" x2="900" y2="100"/>
    <line x1="100" y1="130" x2="900" y2="130"/>
    <line x1="100" y1="160" x2="900" y2="160"/>
  </g>
  <text x="70" y="105" font-family="Arial" font-size="14" font-weight="bold">L1 (460V)</text>
  <text x="70" y="135" font-family="Arial" font-size="14" font-weight="bold">L2 (460V)</text>
  <text x="70" y="165" font-family="Arial" font-size="14" font-weight="bold">L3 (460V)</text>

  <!-- Fuses F1A, F1B, F1C -->
  <rect x="180" y="85" width="40" height="30" fill="#fff" stroke="#000" stroke-width="2"/>
  <rect x="180" y="115" width="40" height="30" fill="#fff" stroke="#000" stroke-width="2"/>
  <rect x="180" y="145" width="40" height="30" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="200" y="105" font-family="Arial" font-size="10" text-anchor="middle">F1A</text>
  <text x="200" y="135" font-family="Arial" font-size="10" text-anchor="middle">F1B</text>
  <text x="200" y="165" font-family="Arial" font-size="10" text-anchor="middle">F1C</text>

  <!-- Main Contactor M1 -->
  <rect x="350" y="85" width="60" height="90" fill="#e9ecef" stroke="#000" stroke-width="2"/>
  <text x="380" y="135" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">M1</text>
  <text x="380" y="150" font-family="Arial" font-size="10" text-anchor="middle">Contactor</text>

  <!-- Overload Relay OL-1 Thermal Elements -->
  <rect x="520" y="85" width="60" height="90" fill="#e9ecef" stroke="#000" stroke-width="2"/>
  <text x="550" y="130" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">OL-1</text>
  <text x="550" y="145" font-family="Arial" font-size="10" text-anchor="middle">Heaters</text>

  <!-- Motor Terminals T1, T2, T3 -->
  <circle cx="750" cy="100" r="25" fill="#ced4da" stroke="#000" stroke-width="2"/>
  <circle cx="750" cy="130" r="25" fill="#ced4da" stroke="#000" stroke-width="2"/>
  <circle cx="750" cy="160" r="25" fill="#ced4da" stroke="#000" stroke-width="2"/>
  <text x="750" y="135" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">MOTOR 75kW</text>

  <!-- Control Circuit Section -->
  <rect x="50" y="230" width="900" height="420" fill="#ffffff" stroke="#495057" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="70" y="255" font-family="Arial" font-size="16" font-weight="bold" fill="#0d6efd">120 VAC CONTROL CIRCUIT SCHEMATIC</text>

  <!-- Step-Down Transformer XFMR-1 -->
  <rect x="100" y="280" width="80" height="50" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="140" y="305" font-family="Arial" font-size="11" text-anchor="middle">XFMR-1 (120V)</text>

  <!-- Control Fuse F2 -->
  <rect x="220" y="290" width="40" height="30" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="240" y="310" font-family="Arial" font-size="10" text-anchor="middle">F2 (2A)</text>

  <!-- E-STOP 1 Switch -->
  <circle cx="320" cy="305" r="15" fill="#dc3545" stroke="#000" stroke-width="2"/>
  <text x="320" y="340" font-family="Arial" font-size="11" text-anchor="middle">ESTOP-1 (NC)</text>

  <!-- Overload Contact NC 95-96 -->
  <rect x="420" y="285" width="80" height="40" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="460" y="305" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">OL-1 (95-96)</text>
  <text x="460" y="318" font-family="Arial" font-size="9" text-anchor="middle">NC Overload Trip</text>

  <!-- Phase Protection Relay Contact PPR-2 (11-14) -->
  <rect x="550" y="285" width="90" height="40" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="595" y="305" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">PPR-2 (11-14)</text>
  <text x="595" y="318" font-family="Arial" font-size="9" text-anchor="middle">Phase Guard NO</text>

  <!-- Stator Thermal Switch TS1/TS2 -->
  <rect x="690" y="285" width="80" height="40" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="730" y="305" font-family="Arial" font-size="11" font-weight="bold" text-anchor="middle">TS1 / TS2</text>
  <text x="730" y="318" font-family="Arial" font-size="9" text-anchor="middle">Stator Thermal NC</text>

  <!-- Start Pushbutton PB-2 & Contactor Coil M1 -->
  <rect x="810" y="285" width="80" height="40" fill="#198754" stroke="#000" stroke-width="2"/>
  <text x="850" y="305" font-family="Arial" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">PB-2 START</text>

  <rect x="810" y="400" width="80" height="50" fill="#0d6efd" stroke="#000" stroke-width="2"/>
  <text x="850" y="425" font-family="Arial" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">M1 COIL</text>
  <text x="850" y="440" font-family="Arial" font-size="10" fill="#fff" text-anchor="middle">(A1 - A2)</text>

  <!-- Wiring Lines in Control Circuit -->
  <path d="M 180 305 L 220 305 M 260 305 L 305 305 M 335 305 L 420 305 M 500 305 L 550 305 M 640 305 L 690 305 M 770 305 L 810 305 M 850 325 L 850 400" fill="none" stroke="#000" stroke-width="2"/>

  <!-- Legend / Region Annotations -->
  <rect x="70" y="480" width="850" height="150" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1"/>
  <text x="90" y="505" font-family="Arial" font-size="14" font-weight="bold" fill="#212529">DIAGNOSTIC CIRCUIT REGIONS & PINOUT REFERENCE:</text>
  <text x="90" y="530" font-family="Arial" font-size="12" fill="#333">• Region A (Power Feeder): Line Fuses F1A-F1C -> Main Contactor M1 -> Thermal Overload OL-1 -> Motor T1-T3.</text>
  <text x="90" y="555" font-family="Arial" font-size="12" fill="#333">• Region B (Safety Loop): Control Fuse F2 -> ESTOP-1 Switch -> Overload NC Contact 95-96.</text>
  <text x="90" y="580" font-family="Arial" font-size="12" fill="#333">• Region C (Protection Guard Loop): PPR-2 Phase Relay Contact (11-14) -> Stator Thermal Cutout TS1/TS2 (TB-2: 13-14).</text>
  <text x="90" y="605" font-family="Arial" font-size="12" fill="#333">• Region D (Actuation Loop): Start Pushbutton PB-2 -> Contactor M1 Coil Terminal A1-A2 (120 VAC).</text>
</svg>
